<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Logístico - CD Itaboraí</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
  <style>
    
    :root {
      --bg: #0a0a0a; --surface: #111111; --surface2: #181818;
      --border: #2a2a2a; --accent: #f0b429; --green: #00e676;
      --orange: #ff6d00; --blue: #4fc3f7; --muted: #888888;
      --text: #e0e0e0; --font-display: 'Source Sans 3', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font-display);
      height: 100vh; overflow: hidden; display: grid;
      grid-template-columns: 65% 35%; grid-template-rows: 62% 38%;
      grid-template-areas: "principal fila" "inferior fila";
    }

    /* --- OVERLAY --- */
    #overlay-inicio {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95); z-index: 10000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; text-align: center;
    }

    /* --- TOPO --- */
    .topo {
      position: fixed; top: 0; left: 0; right: 0; height: 52px; padding: 0 36px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(to bottom, #111, #0a0a0a);
      border-bottom: 1px solid var(--border); z-index: 10;
    }
    .status-conexao { display: flex; align-items: center; gap: 10px; }
    #ponto-conexao { width: 8px; height: 8px; border-radius: 50%; background: var(--green); transition: background 0.3s; }







    
    /* --- AREA PRINCIPAL --- */
    .area-principal {
      grid-area: principal; padding: 60px 20px 12px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
      position: relative; overflow: hidden;
    }

    /* --- PLACA MERCOSUL --- */
    .placa-mercosul {
      background: white; border-radius: 12px; border: 4px solid #222;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8); overflow: hidden;
    }
    .placa-topo {
      background: #1a3a8f; color: white; font-size: 1.2rem; font-weight: 700;
      letter-spacing: 0.3em; text-align: center; padding: 6px 20px;
      font-family: 'Roboto Condensed', sans-serif;
    }
    .placa-numero {
      color: #111; font-family: 'Roboto Condensed', sans-serif;
      font-size: 6rem; font-weight: 700; padding: 8px 30px; line-height: 1;
    }

    /* --- AVISO EPI --- */
    .aviso-epi {
      margin-top: 22px; background: #1a1200; border: 1px solid #f0b429;
      border-radius: 6px; padding: 14px 28px; text-align: center;
      display: flex; flex-direction: column; gap: 6px;
    }
    .aviso-linha { font-size: 0.85rem; letter-spacing: 0.1em; color: #f0b429; opacity: 0.85; }
    .aviso-linha.destaque { font-weight: 700; font-size: 1rem; letter-spacing: 0.15em; opacity: 1; }

    
    

    /* --- TELA ESPERA (relógio grande) --- */
    #tela-espera {
      position: absolute;
      top: 52px; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9;
      gap: 20px;
    }
    #tela-espera.ativo { display: flex; }
    .espera-relogio {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 11rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      letter-spacing: 0.05em;
    }
    .espera-clima {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--muted);
      font-size: 2rem;
    }
    .espera-clima-temp { font-size: 3rem; font-weight: 700; color: var(--text); }
    .espera-clima-icone { font-size: 3rem; }
    .espera-data {
      font-size: 1rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* --- MODO MADRUGADA --- */
    #tela-madrugada {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5000;
      gap: 16px;
    }
    #tela-madrugada.ativo { display: flex; }
    .madrugada-relogio {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 14rem;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1;
    }
    .madrugada-info {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: #1a1a1a;
      text-transform: uppercase;
    }

    /* --- NOVO DESIGN CLIMA --- */
    .clima-wrap {
      width: 100%;
      max-width: 800px;
      text-align: center;
      padding: 20px;
    }
    .clima-titulo {
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 40px;
    }
    .clima-display-principal {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      margin-bottom: 30px;
    }
    .clima-icone-destaque {
      font-size: 7rem;
      filter: drop-shadow(0 0 15px rgba(240, 180, 41, 0.2));
    }
    .clima-temp {
      font-size: 9rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 0.8;
      font-family: 'Roboto Condensed', sans-serif;
    }
    .clima-box-detalhes {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 25px;
      display: inline-block;
      min-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .clima-desc {
      font-size: 2.2rem;
      color: #fff;
      font-weight: 600;
      text-transform: capitalize;
      margin-bottom: 15px;
    }
    .clima-stats {
      display: flex;
      justify-content: center;
      gap: 50px;
      border-top: 1px solid var(--border);
      padding-top: 15px;
    }
    .clima-stat-item { min-width: 100px; }
    .clima-stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
    .clima-stat-valor { font-size: 1.3rem; color: var(--accent); font-weight: 700; }

    /* --- TRÂNSITO REMOVIDO --- */

    /* --- FILA --- */
    .area-fila {
      grid-area: fila; background: var(--surface);
      padding-top: 64px; display: flex; flex-direction: column;
    }
    .fila-colunas {
      display: grid; grid-template-columns: 1fr 1fr;
      flex: 1; border-top: 1px solid var(--border); overflow: hidden;
    }
    .fila-secao {
      padding: 15px; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .fila-secao-titulo {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.15em;
      text-transform: uppercase; margin-bottom: 10px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .item-fila {
      background: var(--surface2); padding: 10px 12px; margin-bottom: 8px;
      border-radius: 4px; border: 1px solid var(--border); border-left: 3px solid var(--border);
    }
    .item-fila.tipo-descarga { border-left-color: #ff6d00; }
    .item-fila.tipo-carga    { border-left-color: #4fc3f7; }
    .item-fila.primeiro      { background: #1a1200; border-left-color: #f0b429; }
    .fila-linha-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .placa-fila      { font-size: 1.35rem; color: #fff; font-weight: 700; }
    .hora-fila       { color: #f0b429; font-weight: 700; font-size: 0.9rem; text-align: right; }
    .hora-fila-carga { color: #4fc3f7; font-weight: 700; font-size: 0.9rem; text-align: right; }

    /* --- BADGES GERAIS --- */
    .label { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .badge { font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 2px; letter-spacing: 0.08em; }
    .badge-descarregando { background: #ff6d00; color: #000; }
    .badge-carregando    { background: #4fc3f7; color: #000; }
    .badge-finalizado    { background: #00e676; color: #000; }
    .badge-revalidacao   { background: #f0b429; color: #000; }
    .badge-contingencia  { background: #b39ddb; color: #000; }

    /* --- BADGES PRODUTO --- */
    .badge-produto {
      display: inline-block; font-size: 0.65rem; font-weight: 700;
      padding: 2px 8px; border-radius: 2px; letter-spacing: 0.08em;
      margin-right: 3px; text-transform: uppercase;
    }
       .badge-cpiii { background-color: #800080; color: white; }
    .badge-cpii  { background-color: #AA0000; color: white; }
    .badge-cpv   { background-color: #C62828; color: white; }
    .badge-maua  { background-color: #117701; color: white; }
    .badge-m25   { background-color: #2FB201; color: black; }
    .badge-geral { background-color: #444;    color: #ccc;  }

    /* --- INFERIOR --- */
    .area-inferior-grid {
      grid-area: inferior; display: grid; grid-template-columns: 1fr 1fr;
      border-right: 1px solid var(--border);
    }
    .box-qr { padding: 12px 20px; border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    #qr-fila-tv { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%; }
    .qr-linha { display: flex; align-items: center; justify-content: center; gap: 22px; }
    #qr-img-tv { display: block; width: min(28vh, 24vw); height: min(28vh, 24vw); background: #fff; padding: 6px; border-radius: 8px; image-rendering: pixelated; flex-shrink: 0; }
    .qr-texto { text-align: left; max-width: 15vw; }
    .qr-texto-titulo { font-size: 1.5rem; font-weight: 700; color: var(--accent); line-height: 1.1; margin-bottom: 10px; }
    .qr-texto-passo { font-size: 1rem; color: #ccc; line-height: 1.35; margin-bottom: 6px; }
    .qr-config-input { width: 100%; max-width: 280px; padding: 8px 10px; font-size: 1rem; background: #000; color: #fff; border: 1px solid var(--border); border-radius: 4px; }
    .qr-config-btn { margin-top: 8px; padding: 8px 18px; font-size: 1rem; font-weight: 700; background: var(--accent); color: #000; border: 0; border-radius: 4px; cursor: pointer; }
    .box-status  { padding: 20px; background: #0d1a0f; overflow-y: auto; }

    /* --- SCROLLBAR --- */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
  </style>
</head>
<body>

  <!-- OVERLAY INICIO -->
  <div id="overlay-inicio" onclick="iniciarPainel()">
    <div style="border: 2px solid #f0b429; padding: 40px; border-radius: 10px;">
      <h1 style="color: #f0b429; margin-bottom: 20px; font-family: 'Source Sans 3', sans-serif;">PAINEL LOGÍSTICO</h1>
      <p style="color: white; font-size: 1.2rem;">Toque para ativar o audio e iniciar</p>
    </div>
  </div>

  <!-- MODO MADRUGADA -->
  <div id="tela-madrugada">
    <div class="madrugada-relogio" id="madrugada-relogio">00:00</div>
    <div class="madrugada-info">CD ITABORAÍ — PAINEL EM ESPERA</div>
  </div>

  <!-- TOPO -->
  <div class="topo">
    <div style="color: #f0b429; font-weight: 700; letter-spacing: 0.12em; font-size: 0.95rem;">CD &mdash; ITABORAÍ</div>
    <div class="status-conexao">
      <div id="ponto-conexao"></div>
      <div id="relogio" style="font-size: 0.95rem; letter-spacing: 0.08em; color: #888;">00:00</div>
    </div>
  </div>

  <!-- PRINCIPAL -->
  <div class="area-principal">

    <!-- Chamada ativa -->
    <div id="painel-principal" style="display:none;">
      <div style="font-size: 2rem; color: #555; opacity: 0.5;">Aguardando Chamada...</div>
    </div>

    <!-- Tela de espera: relógio grande + clima -->
    <div id="tela-espera">
      <div class="espera-data" id="espera-data">--</div>
      <div class="espera-relogio" id="espera-relogio">00:00</div>
      <div class="espera-clima">
        <div class="espera-clima-icone" id="espera-icone">🌡️</div>
        <div class="espera-clima-temp" id="espera-temp">--°</div>
        <div id="espera-desc" style="font-size:1.2rem; color:var(--muted);">--</div>
      </div>
    </div>

    <!-- Vídeo -->
    <!-- Info (clima/trânsito) -->
    <div id="info-container">
      <div id="info-conteudo"></div>
    </div>

  </div>

  <!-- INFERIOR -->
  <div class="area-inferior-grid">
    <div class="box-qr" id="painel-qr">
      <div id="qr-fila-tv"></div>
    </div>
    <div class="box-status">
      <div class="label">Status Patio</div>
      <div id="painel-status"></div>
    </div>
  </div>

  <!-- FILA -->
  <div class="area-fila">
    <div class="fila-colunas">
      <div class="fila-secao">
        <div class="fila-secao-titulo" style="color:#ff6d00;">[⤓] DESCARGA</div>
        <div id="fila-descarga"></div>
      </div>
      <div class="fila-secao">
        <div class="fila-secao-titulo" style="color:#4fc3f7;">[⤒] CARGA</div>
        <div id="fila-carga">
          <div id="fila-carga-agendada"></div>
          <div id="fila-carga-fob"></div>
          <div id="fila-carga-vazia"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- AUDIO -->
  <audio id="som-alerta" src="https://agenda-backend-production-5b72.up.railway.app/msn-wizz-sound.ogg?v=2"></audio>
  <audio id="musica-fundo" src="/Sony Xperia.mp3" loop></audio>

  <script>

    
  var ultimaHoraCiclo = null;
    var modeMadrugada   = false;
    var ultimoChamadoID = null;
    var ultimaPlacaVoz  = '';
    var indiceInfo = 0;
    var dadosClima = null;
    var dadosTransito = null;
    var horaUltimaAtualizacao = '';

    function ehMadrugada() {
      var h = new Date().getHours();
      return h >= 0 && h < 6;
    }

    function verificarMadrugada(chamando) {
      if (!ehMadrugada()) {
        if (modeMadrugada) {
          modeMadrugada = false;
          document.getElementById('tela-madrugada').className = '';
        }
        return false;
      }

      if (chamando) {
        document.getElementById('tela-madrugada').className = '';
        modeMadrugada = false;
        return false;
      }

      if (!modeMadrugada) {
        modeMadrugada = true;
        document.getElementById('tela-espera').className = '';
        document.getElementById('tela-madrugada').className = 'ativo';
      }
      return true;
    }

    var API_URL = 'https://agenda-backend-production-5b72.up.railway.app/agendamentos';

    // --- FILA FOB NA TV: QR CODE, LISTA E CHAVE ---
    var FILA_BASE = 'https://agenda-backend-production-5b72.up.railway.app/api/fila';

    var qtdCargaAgendadaTV = -1;  // -1 = ainda não carregou
    var qtdFilaFobTV       = -1;  // -1 = ainda não carregou, ou há um aviso na tela
    var qrTokenTV          = null;
    var qrFimTV            = 0;
    var qrRenovandoTV      = false;
    var qrEsperaAteTV      = 0;
    var filaTvIniciada     = false;

    // A chave do monitor NUNCA vai embutida na página (/tv é pública): quem
    // tiver a chave consegue gerar QR de qualquer lugar. Ela é informada uma vez
    // por ?chave= na URL ou digitada na própria TV, e fica guardada no navegador.
    function lerChaveTV() {
      try {
        var params = new URLSearchParams(window.location.search);
        var daUrl = (params.get('chave') || '').trim();
        if (daUrl) {
          try { localStorage.setItem('tv_fila_chave', daUrl); }
          catch (e) { return daUrl; } // sem armazenamento: mantém a chave na URL
          params.delete('chave');
          params.delete('chave_admin');
          var busca = params.toString();
          window.history.replaceState({}, '', window.location.pathname + (busca ? '?' + busca : '') + window.location.hash);
          return daUrl;
        }
        return (localStorage.getItem('tv_fila_chave') || localStorage.getItem('fila_chave') || '').trim();
      } catch (e) {
        return '';
      }
    }
    var CHAVE_MONITOR_TV = lerChaveTV();

    function escaparHtmlTV(valor) {
      return String(valor == null ? '' : valor).replace(/[&<>"']/g, function (caractere) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[caractere];
      });
    }

    function pedirXhrTV(url, aoTerminar) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.timeout = 10000;
      xhr.onreadystatechange = function () { if (xhr.readyState === 4) aoTerminar(xhr.status, xhr.responseText); };
      return xhr;
    }

    // "Fila vazia" só aparece se NÃO há carga agendada e NÃO há ninguém na Fila FOB
    function atualizarVazioCargaTV() {
      var el = document.getElementById('fila-carga-vazia');
      if (!el) return;
      el.innerHTML = (qtdCargaAgendadaTV === 0 && qtdFilaFobTV === 0)
        ? '<div style="color:#444;font-size:0.8rem;margin-top:8px;">Fila vazia</div>'
        : '';
    }

    // ── Quadrante do QR ──────────────────────────────────────
    function mensagemQrTV(texto, cor) {
      var el = document.getElementById('qr-fila-tv');
      if (!el) return;
      el.innerHTML =
        '<div class="label">QR Code &mdash; Fila FOB</div>' +
        '<div style="font-size:1.1rem;color:' + (cor || '#888') + ';max-width:90%;">' + escaparHtmlTV(texto) + '</div>';
    }

    function mostrarConfigChaveTV(aviso) {
      var el = document.getElementById('qr-fila-tv');
      if (!el) return;
      el.innerHTML =
        '<div class="label">Fila FOB &mdash; configurar esta TV</div>' +
        (aviso ? '<div style="font-size:0.9rem;color:#ff6d00;margin-bottom:8px;">' + escaparHtmlTV(aviso) + '</div>' : '') +
        '<div style="font-size:0.85rem;color:#888;margin-bottom:8px;">Informe a chave do monitor da fila (só uma vez)</div>' +
        '<input id="tv-chave-input" class="qr-config-input" type="password" autocomplete="off">' +
        '<button id="tv-chave-salvar" class="qr-config-btn" type="button">Salvar</button>';
      var inp = document.getElementById('tv-chave-input');
      var btn = document.getElementById('tv-chave-salvar');
      var salvar = function () { salvarChaveTV(inp.value); };
      btn.onclick = salvar;
      inp.onkeydown = function (e) { if (e.key === 'Enter' || e.keyCode === 13) salvar(); };
      inp.focus();
    }

    function salvarChaveTV(valor) {
      valor = String(valor || '').trim();
      if (!valor) return;
      try { localStorage.setItem('tv_fila_chave', valor); } catch (e) {}
      CHAVE_MONITOR_TV = valor;
      qrTokenTV = null;
      qrEsperaAteTV = 0;
      mensagemQrTV('Conectando...');
      renovarQrTV();
      atualizarFilaFobTV();
    }

    // Chave recusada pelo servidor: esquece e pede de novo
    function invalidarChaveTV(aviso) {
      try { localStorage.removeItem('tv_fila_chave'); localStorage.removeItem('fila_chave'); } catch (e) {}
      CHAVE_MONITOR_TV = '';
      qrTokenTV = null;
      mostrarConfigChaveTV(aviso);
      atualizarFilaFobTV();
    }

    function desenharQrTV(url) {
      var el = document.getElementById('qr-fila-tv');
      if (!el) return;
      var src = FILA_BASE + '/qr.png?chave=' + encodeURIComponent(CHAVE_MONITOR_TV) +
                '&texto=' + encodeURIComponent(url);
      // carrega antes de trocar, para a imagem não piscar
      var pre = new Image();
      pre.onload = function () {
        var atual = document.getElementById('qr-img-tv');
        if (!atual) {
          el.innerHTML =
            '<div class="label">QR Code &mdash; Fila FOB</div>' +
            '<div class="qr-linha">' +
              '<img id="qr-img-tv" alt="QR Code da Fila FOB">' +
              '<div class="qr-texto">' +
                '<div class="qr-texto-titulo">ENTRE NA FILA</div>' +
                '<div class="qr-texto-passo">1. Aponte a câmera do celular para o QR Code</div>' +
                '<div class="qr-texto-passo">2. Informe a placa e o primeiro nome</div>' +
              '</div>' +
            '</div>';
          atual = document.getElementById('qr-img-tv');
        }
        atual.src = src;
      };
      pre.onerror = function () {
        qrTokenTV = null;
        qrEsperaAteTV = Date.now() + 10000;
        mensagemQrTV('Não foi possível carregar o QR Code.');
      };
      pre.src = src;
    }

    function renovarQrTV() {
      if (qrRenovandoTV) return;
      if (!CHAVE_MONITOR_TV) { mostrarConfigChaveTV(); return; }
      qrRenovandoTV = true;
      var xhr = pedirXhrTV(FILA_BASE + '/qr-atual?chave=' + encodeURIComponent(CHAVE_MONITOR_TV), function (status, texto) {
        qrRenovandoTV = false;
        if (status === 200) {
          try {
            var d = JSON.parse(texto);
            if (d && d.url && d.token) {
              qrTokenTV = d.token;
              qrFimTV = Date.now() + (d.restante_ms || 45000);
              desenharQrTV(d.url);
              return;
            }
          } catch (e) {}
          qrTokenTV = null; qrEsperaAteTV = Date.now() + 10000;
          mensagemQrTV('Não foi possível carregar o QR Code.');
        } else if (status === 401) {
          invalidarChaveTV('Chave inválida. Informe novamente.');
        } else if (status === 403) {
          qrTokenTV = null; qrEsperaAteTV = Date.now() + 30000;
          mensagemQrTV('Fila online fechada no momento');
        } else {
          qrTokenTV = null; qrEsperaAteTV = Date.now() + 10000;
          mensagemQrTV('Não foi possível acessar a fila online.');
        }
      });
      xhr.onerror = function () {
        qrRenovandoTV = false; qrTokenTV = null; qrEsperaAteTV = Date.now() + 10000;
        mensagemQrTV('Sem conexão com a fila online.');
      };
      xhr.ontimeout = xhr.onerror;
      xhr.send();
    }

    // A cada 3 s: troca o QR assim que ele foi usado (senão o próximo motorista
    // escaneia um QR já consumido) ou quando faltam 10 s para expirar.
    function verificarQrTV() {
      if (!CHAVE_MONITOR_TV || qrRenovandoTV || Date.now() < qrEsperaAteTV) return;
      if (!qrTokenTV || qrFimTV - Date.now() < 10000) { renovarQrTV(); return; }
      var xhr = pedirXhrTV(
        FILA_BASE + '/qr-status?chave=' + encodeURIComponent(CHAVE_MONITOR_TV) + '&t=' + encodeURIComponent(qrTokenTV),
        function (status, texto) {
          if (status === 401) { invalidarChaveTV('Chave inválida. Informe novamente.'); return; }
          if (status !== 200) return;
          try {
            var s = JSON.parse(texto);
            if (s.usado || s.expirado) renovarQrTV();
          } catch (e) {}
        });
      xhr.send();
    }

    // ── Lista da Fila FOB (coluna CARGA) ─────────────────────
    function atualizarFilaFobTV() {
      var alvo = document.getElementById('fila-carga-fob');
      if (!alvo) return;

      var aviso = function (texto) {
        alvo.innerHTML = '<div style="color:#888;font-size:0.8rem;margin-top:8px;">' + escaparHtmlTV(texto) + '</div>';
        qtdFilaFobTV = -1;
        atualizarVazioCargaTV();
      };

      if (!CHAVE_MONITOR_TV) { aviso('Chave da fila não configurada nesta TV.'); return; }

      var xhr = pedirXhrTV(FILA_BASE + '/tv-lista', function (status, texto) {
        if (status === 401) { invalidarChaveTV('Chave inválida. Informe novamente.'); return; }
        if (status !== 200) { aviso('Não foi possível carregar a Fila FOB.'); return; }
        try {
          var res = JSON.parse(texto);
          var itens = (res && res.itens ? res.itens : []).filter(function (it) {
            return it.status === 'aguardando' || it.status === 'chamado' || it.status === 'carregando';
          });

          qtdFilaFobTV = itens.length;
          if (!itens.length) {
            alvo.innerHTML = '';
            atualizarVazioCargaTV();
            return;
          }

          var html = '';
          for (var i = 0; i < itens.length; i++) {
            var it = itens[i];
            var posStr = String(it.posicao || (i + 1));
            while (posStr.length < 3) posStr = '0' + posStr;
            var extraTag = it.revalidado === true
              ? ' <span class="badge badge-finalizado">REVALIDADO</span>'
              : (it.retido_de ? ' <span class="badge badge-revalidacao">AGUARDANDO REVALIDAÇÃO</span>' : '');
            if (it.em_contingencia === true) {
              extraTag += ' <span class="badge badge-contingencia">CONTINGÊNCIA</span>';
            }

            html +=
              '<div class="item-fila tipo-carga">' +
                '<div class="fila-linha-topo">' +
                  '<span class="placa-fila">' + escaparHtmlTV(it.placa) + '</span>' +
                  '<span class="hora-fila-carga">' + escaparHtmlTV(it.hora || '') + '</span>' +
                '</div>' +
                '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">' +
                  '<span style="font-size:0.75rem;color:#ccc;">' + escaparHtmlTV(it.nome || '') + extraTag + '</span>' +
                  '<span style="font-size:0.65rem;font-weight:700;color:#888;font-family:monospace;">#' + escaparHtmlTV(posStr) + '</span>' +
                '</div>' +
              '</div>';
          }
          alvo.innerHTML = html;
          atualizarVazioCargaTV();
        } catch (e) {
          aviso('Resposta inválida da Fila FOB.');
        }
      });
      xhr.setRequestHeader('x-fila-chave', CHAVE_MONITOR_TV);
      xhr.onerror = function () { aviso('Sem conexão com a Fila FOB.'); };
      xhr.ontimeout = xhr.onerror;
      xhr.send();
    }

      if (d.indexOf('nublado') !== -1 || d.indexOf('encoberto') !== -1) return '☁️';
      if (d.indexOf('nuvem') !== -1 || d.indexOf('parcial') !== -1) return '⛅';
      if (d.indexOf('chuva') !== -1 || d.indexOf('chuvisco') !== -1 || d.indexOf('garoa') !== -1) return '🌧️';
      if (d.indexOf('tempest') !== -1 || d.indexOf('trovão') !== -1) return '⛈️';
      if (d.indexOf('nebl') !== -1 || d.indexOf('névoa') !== -1) return '🌫️';

    // ── VOZ ──────────────────────────────────────────────────
    function anunciarVoz(placa, motorista) {
      if (!window.speechSynthesis || placa === ultimaPlacaVoz) return;
      ultimaPlacaVoz = placa;
      var trechoMot = motorista ? motorista + ' ' : '';
      var texto = 'Atenção motorista ' + trechoMot + 'da placa ' + placa.split('').join(' ') + '. Dirija-se a area de descarga.';
      var msg = new SpeechSynthesisUtterance(texto);
      msg.lang = 'pt-BR';
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(msg);
    }

    // ── PRODUTO ──────────────────────────────────────────────
    function simplificarNome(p) {
      var s = (p || '').toUpperCase();
      if (s.indexOf('CPIII')  !== -1 || s.indexOf('CP-III') !== -1 || s.indexOf('RS-SC') !== -1) return 'CPIII';
      if (s.indexOf('MAUA')   !== -1 || s.indexOf('F-32-SC-V-MA') !== -1) return 'MAUA';
      if (s.indexOf('E32')    !== -1 || s.indexOf('E-32')  !== -1) return 'E32';
      if (s.indexOf('M25')    !== -1 || s.indexOf('25-MA') !== -1) return 'M25KG';
      if (s.indexOf('CPV')    !== -1 || s.indexOf('ARI')   !== -1) return 'CPV';
      if (s.indexOf('CPII')   !== -1 || s.indexOf('CP-II') !== -1) return 'CPII';
      return p || '';
    }
    function classeProduto(n) {
      if (n === 'CPIII') return 'badge-cpiii';
      if (n === 'MAUA')  return 'badge-maua';
      if (n === 'E32')   return 'badge-cpii';
      if (n === 'M25KG') return 'badge-m25';
      if (n === 'CPV')   return 'badge-cpv';
      if (n === 'CPII')  return 'badge-cpii';
      return 'badge-geral';
    }
    function badgesProduto(raw) {
      if (!raw) return '';
      var nomes = [];
      try {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.length) {
          for (var i = 0; i < parsed.length; i++) {
            var n = simplificarNome(parsed[i].produto);
            if (n) nomes.push(n);
          }
        }
      } catch(e) {
        var n2 = simplificarNome(raw);
        if (n2) nomes.push(n2);
      }
      var html = '';
      for (var j = 0; j < nomes.length; j++) {
        html += '<span class="badge-produto ' + classeProduto(nomes[j]) + '">' + nomes[j] + '</span>';
      }
      return html;
    }

    // ── PROCESSAMENTO ────────────────────────────────────────
    function processarDados(dados) {
      var chamando       = null;
      var listaAgendados = [];
      for (var i = 0; i < dados.length; i++) {
        if (dados[i].status === 'chamando') chamando = dados[i];
        if (dados[i].status === 'agendado') listaAgendados.push(dados[i]);
      }
      listaAgendados.sort(function(a, b) {
        return new Date(a.data + ' ' + a.hora) - new Date(b.data + ' ' + b.hora);
      });

      if (verificarMadrugada(chamando)) {
        renderFilaDividida(listaAgendados, dados);
        renderStatus(dados);
        return;
      }

      renderPrincipal(chamando);
      renderFilaDividida(listaAgendados, dados);
      renderStatus(dados);

      if (chamando) {
        esconderTelaEspera();
        if (ultimoChamadoID !== chamando.id) {
          ultimoChamadoID = chamando.id;
          try { document.getElementById('som-alerta').play(); } catch(e) {}
          anunciarVoz(chamando.placa, chamando.motorista);
        }
      } else {
        ultimaPlacaVoz  = '';
        ultimoChamadoID = null;
        mostrarTelaEspera();
      }
    }

    // ── NÚMERO DE FILA (mesma lógica do index) ───────────────
    function calcularNumeroFila(item, todos) {
      var doDia = todos.filter(function(a) {
        return a.data === item.data && a.status !== 'cancelado';
      }).sort(function(a, b) {
        if (a.hora !== b.hora) return (a.hora || '').localeCompare(b.hora || '');
        return (a.id || 0) - (b.id || 0);
      });
      var pos = -1;
      for (var k = 0; k < doDia.length; k++) {
        if (doDia[k].id === item.id) { pos = k; break; }
      }
      if (pos < 0) return '---';
      var n = String(pos + 1);
      while (n.length < 3) n = '0' + n;
      return n;
    }

    // ── RENDER FILA DIVIDIDA ─────────────────────────────────
    function renderFilaDividida(ativos, todos) {
      var htmlDescarga = '';
      var htmlCarga    = '';
      var primeiroDesc = true;
      var qtdCarga     = 0;

      for (var i = 0; i < ativos.length; i++) {
        var item    = ativos[i];
        var isCarga = (item.tipo_operacao === 'CIF' || item.tipo_operacao === 'FOB');
        var badges  = badgesProduto(item.produto);
        var numFila = calcularNumeroFila(item, todos || ativos);

        var classeItem;
        if (!isCarga && primeiroDesc) { classeItem = 'item-fila primeiro'; primeiroDesc = false; }
        else { classeItem = 'item-fila ' + (isCarga ? 'tipo-carga' : 'tipo-descarga'); }

        var horaHtml = isCarga
          ? '<span class="hora-fila-carga">' + item.hora + '<br><small style="font-size:0.75rem;opacity:0.6;">' + item.data.split('-').reverse().join('/') + '</small></span>'
          : '<span class="hora-fila">'       + item.hora + '<br><small style="font-size:0.75rem;opacity:0.6;">' + item.data.split('-').reverse().join('/') + '</small></span>';

        var card =
          '<div class="' + classeItem + '">' +
            '<div class="fila-linha-topo">' +
              '<span class="placa-fila">' + item.placa + '</span>' + horaHtml +
            '</div>' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">' +
              (badges ? '<div>' + badges + '</div>' : '<div></div>') +
              '<span style="font-size:0.65rem;font-weight:700;color:#888;font-family:monospace;letter-spacing:0.5px;">#' + numFila + '</span>' +
            '</div>' +
          '</div>';

        if (isCarga) { htmlCarga += card; qtdCarga++; }
        else         htmlDescarga += card;
      }

      document.getElementById('fila-descarga').innerHTML =
        htmlDescarga || '<div style="color:#444;font-size:0.8rem;margin-top:8px;">Fila vazia</div>';
      document.getElementById('fila-carga-agendada').innerHTML = htmlCarga;
      qtdCargaAgendadaTV = qtdCarga;
      atualizarVazioCargaTV();
    }

    // ── RENDER STATUS ────────────────────────────────────────
    function renderStatus(dados) {
      var el = document.getElementById('painel-status');
      var emOperacao = null;
      var historico  = [];
      for (var i = 0; i < dados.length; i++) {
        if (dados[i].status === 'descarregando' || dados[i].status === 'carregando') emOperacao = dados[i];
        if (dados[i].status === 'finalizado') historico.push(dados[i]);
      }
      historico.sort(function(a, b) { return b.id - a.id; });
      var ultimos = historico.slice(0, 2);

      var html = '<div style="margin-bottom:15px;border-bottom:1px solid #2a2a2a;padding-bottom:10px;">' +
                 '<div class="label">Em Operacao</div>';
      if (emOperacao) {
        var isCIF  = (emOperacao.tipo_operacao === 'CIF' || emOperacao.tipo_operacao === 'FOB');
        var bdProd = badgesProduto(emOperacao.produto);
        html +=
          '<div style="display:flex;justify-content:space-between;align-items:center;">' +
            '<span style="font-size:1.8rem;font-weight:700;color:#fff;">' + emOperacao.placa + '</span>' +
            '<span class="badge ' + (isCIF ? 'badge-carregando' : 'badge-descarregando') + '">' +
              (isCIF ? 'CARREGANDO' : 'DESCARREGANDO') + '</span>' +
          '</div>' +
          (bdProd ? '<div style="margin-top:4px;">' + bdProd + '</div>' : '');
      } else {
        html += '<div style="color:#555;font-style:italic;">Vaga disponivel</div>';
      }
      html += '</div><div><div class="label">Ultimos Finalizados</div>';
      for (var k = 0; k < ultimos.length; k++) {
        html += '<div style="display:flex;justify-content:space-between;margin-bottom:5px;opacity:0.7;">' +
                '<span>' + ultimos[k].placa + '</span>' +
                '<span class="badge badge-finalizado">OK</span></div>';
      }
      el.innerHTML = html;
    }

  </script>
</body>
</html>
